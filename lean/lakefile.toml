name = "FivePointsRiesz"
defaultTargets = ["N5R2", "N5R1"]

# Mathlib is the only dependency (same revision as the Coulomb formalisation); lake-manifest.json
# records the resolved revisions of its own dependencies.
[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# Riesz s = 2: main theorems, axiom check, and the Comparator challenge and solution; the certificate data and checks
# (generated by gen/emit_n5.py from ../certificate/cert_n5_s2_short.json).
[[lean_lib]]
name = "N5R2"
roots = ["N5R2.Main", "N5R2.Check.Axioms", "N5R2.Challenge", "N5R2.Solution"]
globs = ["N5R2.+"]

# H <= phi_2 on [-1, 1) (generated by gen/gen_minor.py).
[[lean_lib]]
name = "N5R2Minor"
globs = ["N5R2Minor.+"]

# Coulomb (s = 1): the same, over Q(sqrt2, sqrt3) (generated by gen/emit_n5_s1.py from
# ../certificate/cert_n5_s1_short.json).
[[lean_lib]]
name = "N5R1"
roots = ["N5R1.Main", "N5R1.Check.Axioms", "N5R1.Challenge", "N5R1.Solution"]
globs = ["N5R1.+"]

# H <= phi_1 on [-1, 1) (generated by gen/gen_minor_s1.py).
[[lean_lib]]
name = "N5R1Minor"
globs = ["N5R1Minor.+"]

# Support library: three files in this directory (ThomsonGen/Cert/) plus modules regenerated from the
# upstream Coulomb formalisation by ./regen.sh.
[[lean_lib]]
name = "ThomsonGen"
globs = ["ThomsonGen.+"]
